<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venta de Celulares | Gestión de Inventario</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/axios@1.3.4/dist/axios.min.js"></script>
</head>
<body onload="obtenerTodos()">

    <header class="main-header">
        <div class="header-content">
            <img src="logo.png" alt="Icono" class="logo-img-espejo">
            <h1>Venta de Celulares</h1>
            <img src="logo.png" alt="Icono" class="logo-img">
        </div>
    </header>

    <main class="wrapper">
        <section class="section-card">
            <h2>Administración de productos</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Modelo</th>
                            <th>Color</th>
                            <th>Almacenamiento</th>
                            <th>Procesador</th>
                        </tr>
                    </thead>
                    <tbody id="tblContenido"></tbody>
                </table>
            </div>
        </section>

        <section class="section-card">
            <h4>Consultar y Gestionar Artículo</h4>
            <div class="search-box">
                <input type="number" id="txtConsulta" placeholder="Ingrese ID del artículo">
                <button class="btn btn-search" onclick="consultarUno()">Consultar</button>
            </div>

            <div class="form-grid">
                <div class="input-field">
                    <label for="consultaNombre">Nombre:</label>
                    <input type="text" id="consultaNombre">
                </div>
                <div class="input-field">
                    <label for="consultaModelo">Modelo:</label>
                    <input type="text" id="consultaModelo">
                </div>
                <div class="input-field">
                    <label for="consultaColor">Color:</label>
                    <input type="text" id="consultaColor">
                </div>
                <div class="input-field">
                    <label for="consultaAlmacenamiento">Almacenamiento:</label>
                    <input type="text" id="consultaAlmacenamiento">
                </div>
                <div class="input-field">
                    <label for="consultaProcesador">Procesador:</label>
                    <input type="text" id="consultaProcesador">
                </div>
            </div>

            <div class="button-group">
                <button class="btn btn-edit" onclick="modificarUno()">Modificar</button>
                <button class="btn btn-delete" onclick="eliminarUno()">Eliminar</button>
            </div>
        </section>

        <section class="section-card">
            <h4>Agregar nuevo artículo</h4>
            <div class="form-grid">
                <input type="text" id="inputMarca" placeholder="Marca">
                <input type="text" id="inputModelo" placeholder="Modelo">
                <input type="text" id="inputColor" placeholder="Color">
                <input type="text" id="inputAlmacenamiento" placeholder="Almacenamiento (GB)">
                <input type="text" id="inputProcesador" placeholder="Procesador">
            </div>
            <button class="btn btn-add" onclick="agregarUno()">Agregar Nuevo</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
