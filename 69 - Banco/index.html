<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen de Cuenta</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <div class="card">
            <header class="header">
                <div class="brand">
                    <img src="logo.png" alt="Logo" class="main-logo">
                    <div class="brand-text">
                        <h1 id="banco">Cargando...</h1>
                        <h2 id="sucursal"></h2>
                    </div>
                </div>
            </header>

            <section class="user-info">
                <div class="info-group">
                    <span class="label">Titular</span>
                    <h3 id="titular"></h3>
                </div>
                <div class="info-group">
                    <span class="label">Número de Cuenta</span>
                    <p id="cuenta" class="account-id"></p>
                </div>
            </section>

            <section class="balance-section">
                <div class="balance-card">
                    <div class="balance-row">
                        <div class="currency">
                            <img src="usd.png" alt="USD">
                            <span>Dólares</span>
                        </div>
                        <div class="amount" id="usd"></div>
                    </div>
                </div>
                <div class="balance-card">
                    <div class="balance-row">
                        <div class="currency">
                            <img src="eur.png" alt="EUR">
                            <span>Euros</span>
                        </div>
                        <div class="amount" id="eur"></div>
                    </div>
                </div>
            </section>

            <footer class="footer-details">
                <div class="detail-item">
                    <strong>CBU:</strong>
                    <span id="cbu"></span>
                </div>
                <div class="detail-item">
                    <strong>Fecha de Apertura:</strong>
                    <span id="abierto"></span>
                </div>
            </footer>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
